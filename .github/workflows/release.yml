name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript types
        run: pnpm compile

      - name: Build & Zip for Chrome MV3
        run: pnpm zip

      - name: Build & Zip for Firefox MV2
        run: pnpm zip:firefox

      - name: Generate clean release notes
        run: |
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name=${{ github.ref_name }} --jq '.body')
          CLEAN_NOTES=$(echo "$NOTES" | sed '/## New Contributors/,/^\*\*Full Changelog\*\*/ { /^\*\*Full Changelog\*\*/!d }')
          echo "$CLEAN_NOTES" > notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
          body_path: notes.md
